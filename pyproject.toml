[project]
name = "orquestador-personal"
version = "0.1.0"
description = "Sistema de orquestacion personal para priorizar tareas academicas segun estado fisiologico y horario fijo"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "garminconnect>=0.2.19",
    "jinja2>=3.1",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["modelo", "fuentes", "motor", "salida", "scripts", "interfaz"]

[tool.setuptools.package-data]
salida = ["plantillas/*.jinja"]
interfaz = ["plantillas/*.html"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
