<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orquestador personal — Editar sesion</title>
<link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
<main>
  <h1>Orquestador personal</h1>
  <nav>
    <a href="/">Hoy y tareas</a>
    <a href="/rendimiento">Rendimiento</a>
    <a href="/entrenamiento">Entrenamiento</a>
  </nav>

  <section>
    <h2>Editar sesion</h2>
    <form class="formulario-tarea" method="post" action="/entrenamiento/{{ indice }}/editar">
      <label>Fecha
        <input type="date" name="fecha" value="{{ sesion.fecha }}" required>
      </label>
      <label>Tipo
        <select name="tipo" required>
          <option value="natacion" {% if sesion.tipo == "natacion" %}selected{% endif %}>Natacion</option>
          <option value="ciclismo" {% if sesion.tipo == "ciclismo" %}selected{% endif %}>Ciclismo</option>
          <option value="running" {% if sesion.tipo == "running" %}selected{% endif %}>Running</option>
          <option value="gimnasio" {% if sesion.tipo == "gimnasio" %}selected{% endif %}>Gimnasio</option>
          <option value="descanso" {% if sesion.tipo == "descanso" %}selected{% endif %}>Descanso</option>
        </select>
      </label>
      <label>Intensidad
        <select name="intensidad" required>
          <option value="alta" {% if sesion.intensidad == "alta" %}selected{% endif %}>Alta</option>
          <option value="moderada" {% if sesion.intensidad == "moderada" %}selected{% endif %}>Moderada</option>
          <option value="baja" {% if sesion.intensidad == "baja" %}selected{% endif %}>Baja</option>
        </select>
      </label>
      <label>Notas
        <input type="text" name="notas" value="{{ sesion.notas }}">
      </label>
      <button type="submit">Guardar cambios</button>
    </form>
  </section>
</main>
</body>
</html>
